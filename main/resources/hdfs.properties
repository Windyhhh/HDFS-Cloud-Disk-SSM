# HDFS Configuration
# Default HDFS NameNode URI
hdfs.namenode.uri=hdfs://localhost:9000

# HDFS User
hdfs.user=hadoop

# HDFS Root Path for Cloud Disk
hdfs.root.path=/cloud-disk

# Connection timeout (milliseconds)
hdfs.connection.timeout=10000

# Read timeout (milliseconds)
hdfs.read.timeout=30000

